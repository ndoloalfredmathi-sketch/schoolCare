<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>SchoolCare</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #2563eb;
        color: white;
        font-family: Arial, sans-serif;
        overflow: hidden;
        border-radius: 8px;
      }

      .splash {
        text-align: center;
      }

      .logo {
        width: 90px;
        height: 90px;
        margin-bottom: 20px;
        border-radius: 20px;
        background: white;
        color: #2563eb;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 42px;
        font-weight: bold;
      }

      h1 {
        margin: 0 0 12px;
        font-size: 28px;
      }

      p {
        margin: 0;
        opacity: 0.8;
      }

      .loader {
        width: 32px;
        height: 32px;
        margin: 24px auto 0;
        border: 4px solid rgba(255, 255, 255, 0.35);
        border-top-color: white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="splash">
      <div class="logo">S</div>
      <h1>SchoolCare</h1>
      <p>Chargement de l'application...</p>
      <div class="loader"></div>
    </div>
  </body>
</html>
