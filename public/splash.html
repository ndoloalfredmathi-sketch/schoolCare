<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>SchoolCare</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #fafafa;
        font-family: "DM Sans", system-ui, sans-serif;
        overflow: hidden;
        border-radius: 10px;
      }

      .splash {
        text-align: center;
      }

      .logo {
        width: 84px;
        height: 84px;
        margin: 0 auto 20px;
        border-radius: 22px;
        background: #fafafa;
        color: #0a0a0a;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 40px;
        font-weight: 700;
      }

      h1 {
        margin: 0 0 8px;
        font-size: 26px;
        font-weight: 600;
      }

      p {
        margin: 0;
        font-size: 14px;
        color: rgba(250, 250, 250, 0.55);
      }

      .loader {
        width: 28px;
        height: 28px;
        margin: 26px auto 0;
        border: 3px solid rgba(250, 250, 250, 0.18);
        border-top-color: #fafafa;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader {
          animation-duration: 2.4s;
        }
      }
    </style>
  </head>

  <body>
    <div class="splash">
      <div class="logo">S</div>
      <h1>SchoolCare</h1>
      <p>Chargement de l'application…</p>
      <div class="loader"></div>
    </div>
  </body>
</html>
